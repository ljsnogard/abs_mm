[package]
name = "abs_mm"
version = "0.1.2"
edition = "2024"

authors = ["lino <lino_snsalias@outlook.com>"]
description = "Abstract Memory Management"
repository = "https://github.com/ljsnogard/abs_mm"
keywords = ["traits", "smart-pointer"]
categories = ["no-std", "memory-management"]
license = "MIT/Apache-2.0"
readme = "README.md"

[features]
core_alloc = []
arc = ["core_alloc"]
box = ["core_alloc"]
rc = ["core_alloc"]
smart_pointers = ["arc", "box", "rc"]
default = ["smart_pointers"]

[dev-dependencies]
log = { version = "0.4.*" }
env_logger = { version = "0.11.*" }
